services:
  - type: web
    name: new-api
    branch: main
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/status
    envVars:
      - key: TZ
        value: Asia/Shanghai
      - key: ERROR_LOG_ENABLED
        value: "true"
      - key: BATCH_UPDATE_ENABLED
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: SQL_DSN
        sync: false
